# ============================================================
# er1.store 的 HTTPS (443) 整段 server 配置 — 直接整段替换用
# ============================================================
# 操作：在宝塔 → 网站 → er1.store → 设置 → 配置文件 里，
#       找到从 "server {" 到对应 "}" 的、含有 listen 443 的那一整段，
#       整段删掉，把下面从 server { 到 } 的全部复制进去替换。
# 证书：下面两行 ssl_certificate / ssl_certificate_key 请改成你当前
#       配置里的真实路径（在宝塔 SSL 页面可看到），否则 HTTPS 会报错。
# ============================================================

server {
    listen 443 ssl http2;
    server_name er1.store;

    # 证书路径请改为你宝塔里实际的路径（在 网站→SSL 里可复制）
    ssl_certificate    /www/server/panel/vhost/cert/er1.store/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/er1.store/privkey.pem;

    # API 转发到 Node（解决小程序 assessments.getLatest 等 404）
    location /api/trpc {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余请求（静态站等，按你原来的 location / 保留或改）
    location / {
        root /www/wwwroot/er1.store;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 若你原来还有别的 location（如静态资源），可在这段 server 里继续加
}
