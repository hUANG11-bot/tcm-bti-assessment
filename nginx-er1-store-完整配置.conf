server
{
    listen 80;
    listen [::]:80;
    server_name er1.store;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/er1.store;
    include /www/server/panel/vhost/nginx/extension/er1.store/*.conf;
    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/er1.store.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/html_er1.store.conf;
    #REWRITE-END

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    location ~ \.well-known
    {
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" )
    {
        return 403;
    }

    location /api/trpc
    {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log /www/wwwlogs/er1.store.log;
    error_log /www/wwwlogs/er1.store.error.log;
}

server
{
    listen 443 ssl ;
    listen [::]:443 ssl ;
    http2 on;
    server_name er1.store;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/er1.store;

    ssl_certificate /www/server/panel/vhost/ssl/er1.store/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/ssl/er1.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    include /www/server/panel/vhost/nginx/extension/er1.store/*.conf;
    include /www/server/panel/vhost/nginx/well-known/er1.store.conf;

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/html_er1.store.conf;
    #REWRITE-END

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    location ~ \.well-known
    {
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" )
    {
        return 403;
    }

    location /api/trpc
    {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log /www/wwwlogs/er1.store.log;
    error_log /www/wwwlogs/er1.store.error.log;
}
